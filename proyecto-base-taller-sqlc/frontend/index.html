<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Productos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d0f;
    --surface:   #141417;
    --border:    #2a2a30;
    --accent:    #e8ff47;
    --accent2:   #47ffe8;
    --danger:    #ff4747;
    --text:      #f0f0f2;
    --muted:     #6b6b78;
    --radius:    6px;
    --mono:      'DM Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 2rem;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: baseline;
    gap: 1.2rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }
  header h1 {
    font-family: var(--sans);
    font-weight: 800;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    letter-spacing: -0.03em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  .tag {
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: .2rem .6rem;
    border-radius: 999px;
    align-self: center;
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }
  .card-title {
    font-family: var(--sans);
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .card-title::before {
    content: '';
    display: block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ── FORM ── */
  .form-group { margin-bottom: 1rem; }
  label {
    display: block;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .4rem;
  }
  input, textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: .85rem;
    padding: .55rem .8rem;
    outline: none;
    transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,255,71,.07);
  }
  textarea { resize: vertical; min-height: 72px; }

  /* ── BUTTONS ── */
  .btn {
    font-family: var(--mono);
    font-size: .8rem;
    letter-spacing: .06em;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    padding: .55rem 1.1rem;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 500;
    width: 100%;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    width: 100%;
    margin-top: .5rem;
  }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .btn-icon {
    padding: .32rem .6rem;
    font-size: .75rem;
    border-radius: 4px;
  }
  .btn-edit  { background: rgba(71,255,232,.12); color: var(--accent2); border: 1px solid rgba(71,255,232,.25); }
  .btn-edit:hover  { background: rgba(71,255,232,.22); }
  .btn-delete { background: rgba(255,71,71,.12); color: var(--danger); border: 1px solid rgba(255,71,71,.25); }
  .btn-delete:hover { background: rgba(255,71,71,.22); }

  /* ── FEEDBACK BAR ── */
  #toast {
    position: fixed;
    bottom: 1.5rem; right: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: .7rem 1.1rem;
    border-radius: var(--radius);
    font-size: .8rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    max-width: 300px;
    z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-left-color: var(--danger); }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  thead th {
    font-family: var(--sans);
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: .7rem .9rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  td { padding: .7rem .9rem; vertical-align: middle; }
  td.id-col { color: var(--muted); font-size: .75rem; }
  td.actions { display: flex; gap: .4rem; }

  /* ── STATES ── */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: .6rem; }
  .loading-row td { color: var(--muted); font-style: italic; text-align: center; padding: 2rem; }

  /* ── STATS BAR ── */
  .stats {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .stat {
    font-size: .72rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .35rem;
  }
  .stat strong { color: var(--text); font-size: .85rem; }

  /* ── EDIT INDICATOR ── */
  .editing-indicator {
    display: none;
    font-size: .72rem;
    color: var(--accent2);
    margin-bottom: .8rem;
    padding: .4rem .7rem;
    background: rgba(71,255,232,.07);
    border: 1px solid rgba(71,255,232,.2);
    border-radius: var(--radius);
  }
  .editing-indicator.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>Gestión de <span>Productos</span></h1>
  <span class="tag">REST CRUD</span>
</header>

<div class="layout">

  <!-- ── FORM PANEL ── -->
  <aside class="card">
    <p class="card-title" id="form-title">Nuevo producto</p>
    <div class="editing-indicator" id="editing-indicator">✎ Editando producto <span id="editing-id"></span></div>
    <input type="hidden" id="producto-id">

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Laptop Pro 14" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" placeholder="Descripción opcional…"></textarea>
    </div>
    <div class="form-group">
      <label for="precio">Precio</label>
      <input type="number" id="precio" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label for="stock">Stock</label>
      <input type="number" id="stock" placeholder="0" min="0" step="1">
    </div>

    <button class="btn btn-primary" id="btn-save" onclick="guardar()">Crear producto</button>
    <button class="btn btn-secondary" id="btn-cancel" onclick="cancelarEdicion()" style="display:none">Cancelar edición</button>
  </aside>

  <!-- ── TABLE PANEL ── -->
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <p class="card-title" style="margin-bottom:0">Inventario</p>
      <button class="btn btn-edit btn-icon" onclick="cargarProductos()">↻ Refrescar</button>
    </div>

    <div class="stats">
      <span class="stat">Total: <strong id="stat-total">—</strong></span>
    </div>

    <div class="table-wrap">
      <table id="tabla">
        <thead>
          <tr>
            <th>#ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="loading-row"><td colspan="6">Cargando productos…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<div id="toast"></div>

<script>
const API = 'http://localhost:8080/api/v1/productos';

// ── Helpers ────────────────────────────────────────────────────────────────
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 3000);
}

function setLoading(on) {
  document.getElementById('btn-save').disabled = on;
  document.getElementById('btn-save').style.opacity = on ? '.5' : '1';
}

function limpiarFormulario() {
  ['producto-id','nombre','descripcion','precio','stock'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

function cancelarEdicion() {
  limpiarFormulario();
  document.getElementById('form-title').textContent = 'Nuevo producto';
  document.getElementById('btn-save').textContent = 'Crear producto';
  document.getElementById('btn-cancel').style.display = 'none';
  document.getElementById('editing-indicator').classList.remove('visible');
}

// ── READ ───────────────────────────────────────────────────────────────────
async function cargarProductos() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="6">Cargando…</td></tr>';
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Normaliza: acepta array raíz o { data: [...] } o { content: [...] }
    const lista = Array.isArray(data) ? data
                : Array.isArray(data.data) ? data.data
                : Array.isArray(data.content) ? data.content
                : [];
    renderTabla(lista);
    document.getElementById('stat-total').textContent = lista.length;
  } catch (err) {
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6">Error al cargar: ${err.message}</td></tr>`;
    toast('No se pudo conectar con la API', true);
  }
}

function renderTabla(lista) {
  const tbody = document.getElementById('tbody');
  if (!lista.length) {
    tbody.innerHTML = `
      <tr><td colspan="6">
        <div class="empty-state">
          <div class="icon">📦</div>
          <div>Sin productos aún. ¡Crea el primero!</div>
        </div>
      </td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(p => `
    <tr data-id="${p.id}">
      <td class="id-col">${p.id ?? '—'}</td>
      <td><strong>${esc(p.nombre ?? p.name ?? '')}</strong></td>
      <td style="color:var(--muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.descripcion ?? p.description ?? '—')}</td>
      <td>$${Number(p.precio ?? p.price ?? 0).toFixed(2)}</td>
      <td>${p.stock ?? p.quantity ?? '—'}</td>
      <td class="actions">
        <button class="btn btn-icon btn-edit"   onclick="prepararEdicion(${p.id})">Editar</button>
        <button class="btn btn-icon btn-delete" onclick="borrar(${p.id})">Borrar</button>
      </td>
    </tr>`).join('');
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CREATE / UPDATE ────────────────────────────────────────────────────────
async function guardar() {
  const id     = document.getElementById('producto-id').value;
  const nombre = document.getElementById('nombre').value.trim();
  const precio = document.getElementById('precio').value;

  if (!nombre) { toast('El nombre es obligatorio', true); return; }

  const body = {
    nombre,
    descripcion: document.getElementById('descripcion').value.trim(),
    precio:      precio !== '' ? parseFloat(precio) : undefined,
    stock:       document.getElementById('stock').value !== ''
                   ? parseInt(document.getElementById('stock').value) : undefined,
  };

  const isEdit = !!id;
  const url    = isEdit ? `${API}/${id}` : API;
  const method = isEdit ? 'PUT' : 'POST';

  setLoading(true);
  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const msg = await res.text().catch(() => res.statusText);
      throw new Error(`HTTP ${res.status}: ${msg}`);
    }
    toast(isEdit ? '✓ Producto actualizado' : '✓ Producto creado');
    cancelarEdicion();
    cargarProductos();
  } catch (err) {
    toast(err.message, true);
  } finally {
    setLoading(false);
  }
}

// ── READ ONE (para editar) ─────────────────────────────────────────────────
async function prepararEdicion(id) {
  try {
    const res = await fetch(`${API}/${id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const p = await res.json();

    document.getElementById('producto-id').value   = p.id;
    document.getElementById('nombre').value        = p.nombre ?? p.name ?? '';
    document.getElementById('descripcion').value   = p.descripcion ?? p.description ?? '';
    document.getElementById('precio').value        = p.precio ?? p.price ?? '';
    document.getElementById('stock').value         = p.stock ?? p.quantity ?? '';

    document.getElementById('form-title').textContent = 'Editar producto';
    document.getElementById('btn-save').textContent   = 'Guardar cambios';
    document.getElementById('btn-cancel').style.display = 'block';
    document.getElementById('editing-id').textContent  = `#${id}`;
    document.getElementById('editing-indicator').classList.add('visible');

    document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    toast('No se pudo cargar el producto', true);
  }
}

// ── DELETE ─────────────────────────────────────────────────────────────────
async function borrar(id) {
  if (!confirm(`¿Eliminar producto #${id}? Esta acción es irreversible.`)) return;
  try {
    const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) throw new Error(`HTTP ${res.status}`);
    toast(`✓ Producto #${id} eliminado`);
    // Quitar fila optimistamente
    const fila = document.querySelector(`tr[data-id="${id}"]`);
    if (fila) fila.remove();
    const total = document.querySelectorAll('#tbody tr[data-id]').length;
    document.getElementById('stat-total').textContent = total;
    if (!total) cargarProductos(); // re-render empty state
  } catch (err) {
    toast(err.message, true);
  }
}

// ── INIT ───────────────────────────────────────────────────────────────────
cargarProductos();
</script>
</body>
</html>
